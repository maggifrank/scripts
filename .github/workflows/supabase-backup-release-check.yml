name: supabase-backup release check

# Deliberately no `paths:` filter, even though this only checks one directory.
# A required status check that is skipped never reports, and a pull request
# waiting for a status that will never arrive is blocked for ever. Sixteen
# seconds on every push is the cheaper mistake.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The declaration check reads the commits on the branch, so it needs
          # more than the shallow clone the default gives it.
          fetch-depth: 0

      - name: release-check
        run: scripts/supabase-backup/release-check

      # Only on a pull request, and only here. A squash merge composes a new
      # message, so a `Release: patch` trailer written on the branch may not
      # survive onto main - running this on push would turn that into a red
      # main for something that was declared correctly when it mattered.
      # Against the base branch as it stands *now*, not the merge base the pull
      # request was opened from. Whether the version is still ahead depends on
      # what has merged since, which is exactly how two branches end up
      # claiming the same number.
      - name: release-check — was the change declared?
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          scripts/supabase-backup/release-check --against "origin/${{ github.base_ref }}"
