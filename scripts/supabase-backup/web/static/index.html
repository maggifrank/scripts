<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Supabase backup</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top">
  <div class="brand">Supabase <em>backup</em></div>
  <div class="top-right">
    <span class="host" id="host"></span>
    <span class="pill pill-unknown" id="health">connecting</span>
  </div>
</header>

<main>
  <p class="reason" id="reason"></p>

  <section class="cards" id="cards" aria-label="Summary"></section>

  <section id="projects" class="projects"><p class="empty">Loading…</p></section>

  <section id="register-section" hidden>
    <h2>Add a project</h2>
    <div id="register" class="item"></div>
  </section>

  <footer>
    Restoring is not done from here — it needs the target project's credentials
    and refuses to touch the project it backs up. Run <code>restore</code> on the host.
  </footer>
</main>

<script type="module" src="/static/app.js"></script>
</body>
</html>
